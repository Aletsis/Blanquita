name: CD - Entrega y Publicación

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        required: true
        default: 'Production'
        type: choice
        options:
          - 'Production'
          - 'Staging'
      create_release:
        description: '¿Crear GitHub Release con el paquete zip?'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Validar Pruebas
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Blanquita.sln

      - name: Compilar solución (Release)
        run: dotnet build Blanquita.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test Blanquita.sln --configuration Release --no-build --verbosity normal

  publish-and-package:
    name: Publicar y Empaquetar Artefacto
    needs: test
    runs-on: windows-latest

    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'Production' }}
      OUTPUT_DIR: ./publish-output

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias del proyecto Web
        run: dotnet restore src/Blanquita.Web/Blanquita.Web.csproj

      - name: Publicar aplicación Blanquita.Web
        shell: pwsh
        run: |
          Write-Host "Publicando para ambiente: $env:TARGET_ENV..."
          dotnet publish src/Blanquita.Web/Blanquita.Web.csproj `
            -c Release `
            -o $env:OUTPUT_DIR `
            --no-restore `
            /p:EnvironmentName=$env:TARGET_ENV

      - name: Inyectar configuración de producción desde Secrets (si existe)
        shell: pwsh
        env:
          APPSETTINGS_SECRET: ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:APPSETTINGS_SECRET)) {
            Write-Host "Inyectando appsettings.$env:TARGET_ENV.json desde GitHub Secrets..."
            $configPath = Join-Path $env:OUTPUT_DIR "appsettings.$env:TARGET_ENV.json"
            $env:APPSETTINGS_SECRET | Out-File -FilePath $configPath -Encoding utf8 -Force
            Write-Host "Configuracion inyectada correctamente."
          } else {
            Write-Host "No se definio secreto APPSETTINGS_PRODUCTION_JSON. Usando archivos del repositorio."
          }

      - name: Preparar directorios de logs y verificar archivos esenciales
        shell: pwsh
        run: |
          # Crear directorios de logs
          New-Item -ItemType Directory -Path "$env:OUTPUT_DIR/logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:OUTPUT_DIR/logs/errors" -Force | Out-Null

          # Validar archivos críticos para IIS
          $criticalFiles = @("Blanquita.Web.dll", "appsettings.json", "web.config")
          $missing = @()
          foreach ($file in $criticalFiles) {
            $path = Join-Path $env:OUTPUT_DIR $file
            if (Test-Path $path) {
              Write-Host "[OK] $file presente" -ForegroundColor Green
            } else {
              Write-Host "[ERROR] Falta archivo critico: $file" -ForegroundColor Red
              $missing += $file
            }
          }

          if ($missing.Count -gt 0) {
            throw "Publicacion incompleta. Faltan los siguientes archivos: $($missing -join ', ')"
          }

      - name: Comprimir paquete de despliegue (.zip)
        shell: pwsh
        run: |
          $zipName = "blanquita-$($env:TARGET_ENV.ToLower())-build-${{ github.run_number }}.zip"
          Write-Host "Generando paquete comprimido: $zipName..."
          Compress-Archive -Path "$env:OUTPUT_DIR/*" -DestinationPath $zipName -Force
          Write-Host "Paquete generado exitosamente."

      - name: Subir artefacto a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: blanquita-${{ env.TARGET_ENV }}-build-${{ github.run_number }}
          path: blanquita-*-build-${{ github.run_number }}.zip
          retention-days: 30

      - name: Crear GitHub Release con paquete adjunto
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: blanquita-*-build-${{ github.run_number }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.TARGET_ENV != 'Production' }}
